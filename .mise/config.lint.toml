[tools]
'aqua:jdx/hk' = { version = '2.3.1', postinstall = 'hk install' }
'aqua:rhysd/actionlint' = '1.7.12'
'aqua:koalaman/shellcheck' = '0.11.0'
'aqua:hadolint/hadolint' = '2.15.1'
'aqua:oxc-project/oxc/oxlint' = '1.81.0'
'aqua:oxc-project/oxc/oxfmt' = '1.81.0'
'aqua:zizmorcore/zizmor' = '1.30.1'
'aqua:crate-ci/typos' = '1.50.3'
'aqua:tombi-toml/tombi' = '1.5.7'
'npm:@commitlint/cli' = '21.2.3'
'npm:renovate' = { version = '44.115.13', bun_args = '--trust', trust_policy_excludes = [
  '@yarnpkg/libzip@3.2.2',
] }
'npm:markdownlint-cli2' = '0.23.3'
'aqua:wasilibs/go-yamllint' = '1.38.0'
'aqua:apple/pkl' = '0.32.1'

[tasks.lint]
description = 'Run all code quality checks via hk'
shell = 'nu -c'
run = '''
if ($env.GH_TOKEN? | is-not-empty) or ($env.GITHUB_TOKEN? | is-not-empty) {
  hk check --all
} else if (which fnox | is-not-empty) {
  fnox exec -P github -- hk check --all
} else {
  hk check --all
}
'''

[tasks.fmt]
description = 'Fix formatting and linting errors via hk'
shell = 'nu -c'
run = '''
if ($env.GH_TOKEN? | is-not-empty) or ($env.GITHUB_TOKEN? | is-not-empty) {
  hk fix --all
} else if (which fnox | is-not-empty) {
  fnox exec -P github -- hk fix --all
} else {
  hk fix --all
}
'''
